name: Update profile widgets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@f6a050a9d2f1af6235f1eecafe00894b053ccb5d
        with:
          card: stats
          options: "username=ianptkcs&show_icons=true&hide_border=true&border_radius=10&bg_color=0D1117&title_color=CC3333&icon_color=CC3333&text_color=C9D1D9&border_color=CC3333"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@f6a050a9d2f1af6235f1eecafe00894b053ccb5d
        with:
          card: top-langs
          options: "username=ianptkcs&layout=compact&hide_border=true&border_radius=10&bg_color=0D1117&title_color=CC3333&text_color=C9D1D9&border_color=CC3333"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy card
        uses: Erik-Donath/github-profile-trophy@eb0893b31de06841663555d10aa43eb7cf27952f
        with:
          username: ianptkcs
          output_path: profile/trophy.svg
          theme: dark_lover
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile widget cards" || exit 0
          git push
